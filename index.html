<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P 系統音樂串流｜A電腦音樂傳給B電腦</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{max-width:820px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee;line-height:1.6}
h1{text-align:center;margin-bottom:1rem;color:#5cf}
.card{background:#222;padding:1.2rem;border-radius:12px;margin-bottom:1rem}
textarea{width:100%;min-height:120px;background:#000;color:#cfc;border:1px solid #444;padding:0.8rem;border-radius:8px;font-family:monospace;resize:vertical;margin:0.5rem 0}
button{padding:0.7rem 1.2rem;border:none;border-radius:8px;background:#29a;color:white;font-weight:bold;cursor:pointer;margin:0.3rem;font-size:1rem}
button:disabled{background:#444;cursor:not-allowed}
.info{color:#aad;margin:0.4rem 0;font-size:0.9rem}
.status{padding:0.6rem;border-radius:8px;margin:0.6rem 0;background:#334}
.ready{background:#242;color:#8f8}
.wait{background:#432;color:#fd8}
.err{background:#422;color:#f88}
.tip{color:#fc8;font-size:0.9rem}
</style>
</head>
<body>
<h1>🎵 P2P 系統音頻串流（傳電腦正在播放的音樂）</h1>
<div class="status" id="status">等待操作</div>

<div class="card">
  <h3>1. 發送端（A電腦：播放音樂這台）</h3>
  <p class="tip">⚠️ 彈窗選【整個畫面】，記得勾選【分享系統音頻】！</p>
  <button id="btnSender">開始傳送系統音頻</button>
  <textarea id="localSDP" readonly placeholder="你的SDP報文會在這裡，複製給B"></textarea>
  <button id="copyLocal">複製報文</button>
</div>

<div class="card">
  <h3>2. 接收端（B電腦：收聽音樂）</h3>
  <p class="info">把A給你的報文貼上，點擊接收連線，之後把產生的報文回傳A</p>
  <textarea id="remoteSDP" placeholder="貼上對方的SDP報文"></textarea>
  <button id="btnConnect">接收連線</button>
</div>

<div class="card">
  <h3>🎧 接收播放</h3>
  <audio id="audioPlayer" controls autoplay>
  <p class="info">連線成功後自動播放A電腦的音樂</p>
</div>

<script>
const statusEl = document.getElementById('status');
const localSDP = document.getElementById('localSDP');
const remoteSDP = document.getElementById('remoteSDP');
const btnSender = document.getElementById('btnSender');
const btnConnect = document.getElementById('btnConnect');
const copyLocal = document.getElementById('copyLocal');
const audioPlayer = document.getElementById('audioPlayer');

let pc = null;
let systemStream = null;
const config = {
  iceServers: [
    {urls: 'stun:stun.l.google.com:19302'},
    {urls: 'stun:global.stun.twilio.com:3478'}
  ]
};

function setStatus(txt, type=''){
  statusEl.textContent = txt;
  statusEl.className = 'status '+type;
}

// 發送端：抓取系統音頻（螢幕分享+系統音頻）
btnSender.onclick = async ()=>{
  try{
    setStatus('正在請求系統音頻分享，請在彈窗勾【分享系統音頻】...','wait');
    // getDisplayMedia 必須帶video:true，即使我們不要視訊
    systemStream = await navigator.mediaDevices.getDisplayMedia({
      video:true,
      audio:true
    });
    // 關閉視訊軌，只保留音頻
    systemStream.getVideoTracks().forEach(track=>track.enabled=false);

    pc = new RTCPeerConnection(config);
    systemStream.getAudioTracks().forEach(track=> pc.addTrack(track, systemStream));

    pc.ontrack = (e)=>{
      audioPlayer.srcObject = e.streams[0];
      setStatus('✅ 連線成功，正在接收音樂！','ready');
    };
    pc.onicecandidate = (e)=>{
      if(!e.candidate) return;
      localSDP.value = JSON.stringify({sdp:pc.localDescription, ice:e.candidate});
    };
    pc.onicegatheringstatechange = ()=>{
      if(pc.iceGatheringState === 'complete'){
        localSDP.value = JSON.stringify({sdp:pc.localDescription});
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    setStatus('✅ 已產生Offer，複製文字給B電腦','wait');
  }catch(err){
    setStatus('❌ 錯誤：'+err.message,'err');
    console.error(err);
  }
};

// 接收端
btnConnect.onclick = async ()=>{
  try{
    setStatus('處理對方報文中...','wait');
    const data = JSON.parse(remoteSDP.value.trim());
    pc = new RTCPeerConnection(config);

    pc.ontrack = (e)=>{
      audioPlayer.srcObject = e.streams[0];
      setStatus('✅ 音樂串流已到達！','ready');
    };
    pc.onicecandidate = (e)=>{
      if(!e.candidate) return;
      localSDP.value = JSON.stringify({sdp:pc.localDescription, ice:e.candidate});
    };

    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    setStatus('✅ 已產生Answer，複製回傳給A完成配對','wait');
  }catch(err){
    setStatus('❌ 連線失敗：'+err.message,'err');
    console.error(err);
  }
};

copyLocal.onclick = async ()=>{
  await navigator.clipboard.writeText(localSDP.value);
  setStatus('已複製到剪貼簿','ready');
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P 系統音頻串流｜Base64分享版</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{max-width:820px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee;line-height:1.6}
h1{text-align:center;margin-bottom:1rem;color:#5cf}
.card{background:#222;padding:1.2rem;border-radius:12px;margin-bottom:1rem}
input,textarea{width:100%;background:#000;color:#cfc;border:1px solid #444;padding:0.8rem;border-radius:8px;font-family:monospace;resize:vertical;margin:0.5rem 0}
textarea{min-height:100px}
button{padding:0.7rem 1.2rem;border:none;border-radius:8px;background:#29a;color:white;font-weight:bold;cursor:pointer;margin:0.3rem;font-size:1rem}
button:disabled{background:#444;cursor:not-allowed}
.info{color:#aad;margin:0.4rem 0;font-size:0.9rem}
.status{padding:0.6rem;border-radius:8px;margin:0.6rem 0;background:#334}
.ready{background:#242;color:#8f8}
.wait{background:#432;color:#fd8}
.err{background:#422;color:#f88}
.tip{color:#fc8;font-size:0.9rem}
</style>
</head>
<body>
<h1>🎵 P2P 系統音頻串流｜連結分享版</h1>
<div class="status" id="status">等待操作</div>

<div class="card">
  <h3>📤 發送端（A，播放音樂）</h3>
  <p class="tip">⚠️ 彈窗選整個畫面，勾【分享系統音頻】</p>
  <button id="btnSender">開始傳送系統音頻</button>
  <div class="info">分享連結 / 編碼訊號：</div>
  <input id="shareLink" readonly>
  <button id="copyLink">複製分享連結</button>
</div>

<div class="card">
  <h3>🔗 貼上對方回傳的訊號</h3>
  <p class="info">把B回傳的連結/編碼字串貼進來，按套用</p>
  <input id="remoteSignal" placeholder="貼上對方的訊號字串或連結">
  <button id="btnApply">套用訊號</button>
</div>

<div class="card">
  <h3>🎧 接收播放</h3>
  <audio id="audioPlayer" controls autoplay>
</div>

<script>
const statusEl = document.getElementById('status');
const shareLink = document.getElementById('shareLink');
const remoteSignal = document.getElementById('remoteSignal');
const btnSender = document.getElementById('btnSender');
const btnApply = document.getElementById('btnApply');
const copyLink = document.getElementById('copyLink');
const audioPlayer = document.getElementById('audioPlayer');

let pc = null;
let systemStream = null;
const config = {
  iceServers: [
    {urls: 'stun:stun.l.google.com:19302'},
    {urls: 'stun:global.stun.twilio.com:3478'}
  ]
};

function setStatus(txt, type=''){
  statusEl.textContent = txt;
  statusEl.className = 'status '+type;
}

function encodeSignal(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
}
function decodeSignal(str){
  try{
    const raw = decodeURIComponent(escape(atob(str.trim())));
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}
function extractHash(s){
  if(s.startsWith('http')){
    const u = new URL(s);
    return u.hash.slice(1);
  }
  return s;
}

// 頁面載入自動讀取網址 # 後面的訊號
window.onload = async ()=>{
  if(location.hash.length > 1){
    remoteSignal.value = location.hash.slice(1);
    setStatus('偵測到網址內訊號，你可以直接按套用訊號');
  }
}

btnSender.onclick = async ()=>{
  try{
    setStatus('正在抓取系統音頻...','wait');
    systemStream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    systemStream.getVideoTracks().forEach(t=>t.enabled=false);
    pc = new RTCPeerConnection(config);
    systemStream.getAudioTracks().forEach(t=>pc.addTrack(t, systemStream));

    pc.ontrack = e=>{
      audioPlayer.srcObject = e.streams[0];
      setStatus('✅ 連線成功，正在播放音樂','ready');
    }
    pc.onicecandidate = e=>{
      if(!e.candidate) return;
      const payload = {sdp:pc.localDescription};
      const code = encodeSignal(payload);
      const url = location.origin + location.pathname + '#' + code;
      shareLink.value = url;
    }
    pc.onicegatheringstatechange = ()=>{
      if(pc.iceGatheringState === 'complete'){
        const payload = {sdp:pc.localDescription};
        const code = encodeSignal(payload);
        const url = location.origin + location.pathname + '#' + code;
        shareLink.value = url;
      }
    }
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    setStatus('✅ 已產生分享連結，複製給B','wait');
  }catch(err){
    setStatus('❌ '+err.message,'err');
  }
}

btnApply.onclick = async ()=>{
  try{
    setStatus('解析訊號...','wait');
    const hashStr = extractHash(remoteSignal.value.trim());
    const data = decodeSignal(hashStr);
    if(!data) throw new Error('訊號解析失敗');
    if(!pc){
      pc = new RTCPeerConnection(config);
      pc.ontrack = e=>{
        audioPlayer.srcObject = e.streams[0];
        setStatus('✅ 音樂串流連線成功！','ready');
      }
      pc.onicecandidate = e=>{
        if(!e.candidate) return;
        const payload = {sdp:pc.localDescription};
        const code = encodeSignal(payload);
        const url = location.origin + location.pathname + '#' + code;
        shareLink.value = url;
      }
    }
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    if(!pc.localDescription){
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      setStatus('✅ 已產生回傳連結，複製回給A','wait');
    }else{
      setStatus('✅ 收到Answer，配對完成！','ready');
    }
  }catch(err){
    setStatus('❌ '+err.message,'err');
  }
}

copyLink.onclick = async ()=>{
  await navigator.clipboard.writeText(shareLink.value);
  setStatus('連結已複製','ready');
}
</script>
</body>
</html>
